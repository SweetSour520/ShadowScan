name: Build and Release ShadowScan

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0, v1.0.1 等标签时触发
  workflow_dispatch: # 允许你在 Actions 页面手动点击按钮触发打包

permissions:
  contents: write # 必须赋予写权限，否则无法上传打包后的文件到 Release

jobs:
  createrelease:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 同时启动三台虚拟机：Linux, Windows, macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 使用兼容性较好的 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        # 重要：ShadowScan.py 的大小写必须与你项目中的文件名完全一致
        run: pyinstaller --onefile --clean ShadowScan.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          # 自动识别生成的文件：Windows 是 .exe，Linux/Mac 是无后缀文件
          files: |
            dist/ShadowScan*
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}