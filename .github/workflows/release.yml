name: Build Release
on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的标签时触发
jobs:
  createrelease:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile shadowscan.py
      # 之后添加上传到 Release 的步骤