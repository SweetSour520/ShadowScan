name: Build and Release

on:
  push:
    tags:
      - 'v*' # 只有推送 v 开头的标签才会触发

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: ShadowScan.exe
            asset_name: ShadowScan_win.zip
          - os: ubuntu-latest
            artifact_name: ShadowScan
            asset_name: ShadowScan_linux.zip
          - os: macos-latest
            artifact_name: ShadowScan
            asset_name: ShadowScan_mac.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.artifact_name }} ShadowScan.py

      - name: Prepare Workspace and Zip
        shell: bash
        run: |
          # 修正变量定义使用 = 
          STAGING="ShadowScan_${{ github.ref_name }}_${{ matrix.os }}"
          mkdir -p "$STAGING/directory"
          
          # 动态拷贝不同系统的二进制文件
          cp dist/${{ matrix.artifact_name }} "$STAGING/"
          
          # 拷贝资源文件（确保你的仓库里有 directory 文件夹）
          cp directory/domain_list.txt "$STAGING/directory/" || echo "No dict found"
          cp README.md "$STAGING/"
          cp LICENSE "$STAGING/" || echo "No license found"
          
          # 根据系统选择打包工具
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "${{ matrix.asset_name }}" "$STAGING"
          else
            zip -r "${{ matrix.asset_name }}" "$STAGING"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}