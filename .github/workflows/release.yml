name: Build and Release ShadowScan

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  createrelease:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os_name 用于后续压缩包命名
        include:
          - os: ubuntu-latest
            os_name: linux
            artifact_name: ShadowScan
          - os: windows-latest
            os_name: win
            artifact_name: ShadowScan.exe
          - os: macos-latest
            os_name: mac
            artifact_name: ShadowScan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --onefile --clean ShadowScan.py

      - name: Prepare Workspace and Zip
        shell: bash
        run: |
          # 1. 创建一个临时发布的文件夹
          STAGING="ShadowScan_1.0.0_${{ matrix.os_name }}"
          mkdir -p "$STAGING/directory"
          
          # 2. 拷贝二进制文件（从 dist 目录）
          cp dist/${{ matrix.artifact_name }} "$STAGING/"
          
          # 3. 拷贝字典和文档 
          cp directory/domain_list.txt "$STAGING/directory/"
          cp README.md "$STAGING/"
          cp LICENSE "$STAGING/" || true
          
          # 4. 打包成 ZIP
          if [ "${{ matrix.os_name }}" == "win" ]; then
            7z a "$STAGING.zip" "$STAGING"
          else
            zip -r "$STAGING.zip" "$STAGING"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ShadowScan_1.0.0_${{ matrix.os_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}